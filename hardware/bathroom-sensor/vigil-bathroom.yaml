# VIGIL bathroom sensor: Seeed MR60FDA2 60 GHz radar kit with a XIAO ESP32-C6.
# It never makes an image. When the radar reports a fall it tells VIGIL, which sends the
# usual fall alert ("The bathroom sensor reported a possible fall"). While the fall is still
# reported, VIGIL sends nothing more; "clear" ends it.
#
# Flash: install ESPHome (pip install esphome), fill in secrets.yaml (see secrets.example.yaml),
# plug the kit in by USB-C, then:   esphome run vigil-bathroom.yaml
# Needs ESPHome 2025.2 or newer (the seeed_mr60fda2 component and http_request request_headers).

substitutions:
  sensor_id: bathroom-1
  room: Bathroom

esphome:
  name: vigil-${sensor_id}
  friendly_name: VIGIL ${room} sensor

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                                   # if the Wi-Fi is wrong, it opens its own hotspot to fix it
    ssid: VIGIL-sensor-setup
    password: !secret setup_password

captive_portal:

http_request:
  verify_ssl: true
  timeout: 10s

uart:
  id: radar_uart
  baud_rate: 115200
  rx_pin: GPIO17
  tx_pin: GPIO16
  parity: NONE
  stop_bits: 1

seeed_mr60fda2:
  uart_id: radar_uart

script:
  - id: tell_vigil
    mode: queued
    parameters:
      what: string
    then:
      - http_request.post:
          url: !secret vigil_sensor_url      # https://api.vigilhealth.me/relay/<camera id>/sensor
          request_headers:
            Content-Type: application/json
            X-Relay-Key: !secret vigil_relay_key
          json:
            sensor_id: ${sensor_id}
            room: ${room}
            kind: radar
            event: !lambda 'return what;'

binary_sensor:
  - platform: seeed_mr60fda2
    people_exist:
      name: Someone in the room
    fall_detected:
      name: Fall
      on_press:
        - script.execute:
            id: tell_vigil
            what: fall
      on_release:
        - script.execute:
            id: tell_vigil
            what: clear

select:
  - platform: seeed_mr60fda2
    install_height:
      name: Install height          # set to the real ceiling height after mounting (default 3 m)
    height_threshold:
      name: Fall height threshold   # default 0.6 m
    sensitivity:
      name: Sensitivity             # 1 to 3, default 1

interval:
  - interval: 5min                  # lets VIGIL show the sensor as online
    then:
      - script.execute:
          id: tell_vigil
          what: heartbeat
